<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <title>index</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.0/github-markdown.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        /* ========== 全局主题变量 ========== */
        :root {
            color-scheme: light dark;
            --bg-body: #f6f8fa;
            --bg-card: #ffffff;
            --text-primary: #24292f;
            --text-secondary: #57606a;
            --border-light: #e1e4e8;
            --code-bg: #f6f8fa;
            --code-header-bg: #f1f3f5;
            --code-header-border: #e1e4e8;
            --btn-bg: #ffffff;
            --btn-border: #d0d7de;
            --btn-hover-bg: #eaeef2;
            --shadow: 0 1px 4px rgba(0,0,0,0.1);
            --code-text: #24292f;
            --line-numbers-color: #8c959f;
            
            
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #0d1117;
                --bg-card: #161b22;
                --text-primary: #c9d1d9;
                --text-secondary: #8b949e;
                --border-light: #30363d;
                --code-bg: #0d1117;
                --code-header-bg: #21262d;
                --code-header-border: #30363d;
                --btn-bg: #21262d;
                --btn-border: #30363d;
                --btn-hover-bg: #30363d;
                --shadow: 0 1px 4px rgba(0,0,0,0.3);
                --code-text: #c9d1d9;
                --line-numbers-color: #8b949e;
                
                
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            padding: 2rem;
            background-color: var(--bg-body);
            color: var(--text-primary);
        }
        
        
        .markdown-body {
            max-width: 1200px;
            margin: 0 auto;
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 2rem;
            box-shadow: var(--shadow);
        }
        .markdown-body {
            color: var(--text-primary) !important;
        }
        .code-content pre code,
        .code-content pre code.hljs {
            color: var(--code-text) !important;
            background-color: var(--code-bg) !important;
        }
        .line-numbers {
            color: var(--line-numbers-color) !important;
            background-color: var(--code-bg) !important;
        }
        .code-wrapper {
            margin: 1rem 0;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-light);
        }
        .code-header {
            display: flex;
            justify-content: space-between;
            background-color: var(--code-header-bg);
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--code-header-border);
        }
        .code-lang {
            font-weight: 600;
            color: var(--text-primary);
        }
        .copy-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 6px;
            padding: 0.2rem 0.6rem;
            cursor: pointer;
            color: var(--text-primary);
        }
        .copy-btn:hover { background-color: var(--btn-hover-bg); }
        .copy-btn.copied {
            background: #2cbe4e;
            border-color: #2cbe4e;
            color: white;
        }
        .code-content pre {
            margin: 0 !important;
            border-radius: 0 !important;
            background-color: var(--code-bg) !important;
            overflow-x: auto;
            padding: 10px;
            padding-top: 5px;
            padding-bottom: 5px;
        }
        .code-content pre code {
            padding: 0 !important;
            tab-size: 4;
            -moz-tab-size: 4;
        }
        .footer {
            max-width: 1200px;
            margin: 2rem auto 0;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-light);
            padding: 1.5rem 0;
        }
        .footer a {
            color: #0969da;
            text-decoration: none;
        }
        .katex-display { overflow-x: auto; }
        .katex-error {
            color: #dc2626;
            background: #fef2f2;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
        }
        @media (max-width: 768px) {
            .markdown-body { padding: 1rem; }
            
        }
    </style>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {
        delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}],
        ignoredTags: ['pre', 'code', 'script', 'style', 'textarea'],
        ignoredClasses: ['code-wrapper', 'line-numbers', 'copy-btn']
    });"></script>
</head>
<body>
<div class="">
    <div class="main-content">
        
        <div class="markdown-body"><h2 id="api-docs">API docs</h2>
<p><a href="./API_docs.html">API docs English</a></p>
<h2 id="developments">Developments</h2>
<h3 id="judger-access-control-model">Judger Access Control Model</h3>

</div>
        <div class="footer">
            <p>© 2026 · 本文采用 <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">CC BY-NC-SA 4.0</a> 许可协议</p>
        </div>
    </div>
    
</div>
<script>
(function() {
    // 复制按钮
    document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            const code = btn.getAttribute('data-code');
            if (code) {
                await navigator.clipboard.writeText(code);
                const orig = btn.textContent;
                btn.textContent = '已复制！';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
            }
        });
    });
    
    
})();
</script>
</body>
</html>
